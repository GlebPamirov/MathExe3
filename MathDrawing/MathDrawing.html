<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MathDrawing v9.0 — Modular</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="toolbar">
        <button class="btn" onclick="MathDrawingCore.undo()">↩</button>
        <button class="btn" onclick="MathDrawingCore.redo()">↪</button>
        <button class="btn" id="angle-mode-btn" onclick="MathDrawingUI.setMode('angle')">📐</button>
		<button class="btn" id="circle-mode-btn" onclick="MathDrawingUI.setMode('circle')">⭕</button>
        <button class="btn" id="eraser-mode-btn" onclick="MathDrawingUI.setMode('eraser')">🧼</button>
        <button class="btn" style="margin-left:auto" onclick="MathDrawingCore.clearAll()">♻</button>
    </div>

    <div id="canvas-container">
        <canvas id="geoCanvas"></canvas>
        <div id="master-menu" class="context-menu">
            <div id="menu-content"></div>
            <button class="btn" style="color:red; border-color:red; width:100%; margin-top:5px" onclick="MathDrawingUI.deleteTarget()">Удалить</button>
        </div>
    </div>
	
	<div class="sheet-controls" style="padding: 10px; border: 1px solid #ddd; margin: 10px; border-radius: 8px;">
		<h4>Синхронизация с базой данных</h4>
		
		<input type="text" id="user-comment" placeholder="Название чертежа" class="menu-input">
		<button class="btn" onclick="MathDrawingUI.saveToSheets()">Сохранить</button>
		
		<hr>
		
		<label>Загрузить:</label>
		<select id="sheet-load-select" class="menu-input" onchange="MathDrawingUI.loadSingleDrawing(this.value)">
			<option value="">Загрузка задач...</option>
		</select>
	</div>
	

	<div id="debug-output" style="margin-top: 20px; padding: 10px; background: #f0f0f0; border-top: 1px solid #ccc; font-size: 12px; font-family: monospace; word-break: break-all;">
		<strong>Отладка:</strong> <span id="debug-content">Данные отсутствуют</span>
	</div>
	
	<div class="import-controls" style="padding: 10px; display: flex; flex-direction: column; gap: 10px; max-width: 400px; border-top: 1px solid #eee;">
		<input type="text" id="import-code" placeholder="Вставьте код чертежа сюда..." class="menu-input" style="width: 100%;">
		<button class="btn" onclick="MathDrawingUI.importResult()" style="width: 100%; background: #0984e3; color: white;">Построить чертеж</button>
	</div>
	
	
	
	<div id="master-menu" style="display:none; position:absolute; z-index:1000; flex-direction:column; background:white; border:1px solid #ccc; padding:10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border-radius: 8px;">
		<div id="menu-content"></div>
		<hr>
		<button onclick="MathDrawingUI.deleteTarget()" style="color:red; cursor:pointer;">Удалить</button>
		<button onclick="MathDrawingUI.closeMenu()" style="margin-top:5px; cursor:pointer;">Закрыть</button>
	</div>
    
    <script src="MathDrawingCore.js"></script>
    <script src="MathDrawingEngine.js"></script>
    <script src="MathDrawingRender.js"></script>
    <script src="MathDrawingUI.js"></script>
    <script src="MathDrawingEvents.js"></script>
    
	<script>
        window.onload = () => {
            // Инициализируем данные
            MathDrawingCore.init(); 
            // Инициализируем холст и запускаем рендер
            MathDrawingEvents.init('geoCanvas');
            console.log("Редактор запущен");
        };
    </script>
</body>
</html>
